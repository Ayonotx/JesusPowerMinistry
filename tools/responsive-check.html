<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive harness</title>
  <style>
    body { margin: 0; background: #20242c; font-family: system-ui, sans-serif; display: flex; gap: 16px; padding: 16px; }
    figure { margin: 0; }
    figcaption { color: #cbd2dc; font-size: 12px; margin-bottom: 6px; }
    iframe { border: 0; background: #fff; border-radius: 8px; }
  </style>
</head>
<body>
  <figure>
    <figcaption>320 px</figcaption>
    <iframe src="../index.html" width="320" height="760"></iframe>
  </figure>
  <figure>
    <figcaption>390 px</figcaption>
    <iframe src="../index.html" width="390" height="760"></iframe>
  </figure>
  <figure>
    <figcaption>768 px</figcaption>
    <iframe src="../index.html" width="768" height="760"></iframe>
  </figure>
</body>
</html>
